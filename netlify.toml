[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

# Netlify automatically detects Next.js and handles SSR
# If you need the plugin, install it: npm install --save-dev @netlify/plugin-nextjs
# Then uncomment the line below:
# [[plugins]]
#   package = "@netlify/plugin-nextjs"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
